name: Join Venues and Local Time

on:
  workflow_dispatch:

jobs:
  join-venues:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Join venues and derive local kickoff time
        run: |
          python src/normalization/join_venues.py

      - name: Upload venue-enriched artifact
        uses: actions/upload-artifact@v4
        with:
          name: joined-venues-local-time
          path: data/normalized/venues/joined/
          if-no-files-found: error
