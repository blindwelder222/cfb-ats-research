name: Join Rankings

on:
  workflow_dispatch:

jobs:
  join-rankings:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Join rankings to betting-enriched games
        run: |
          python src/normalization/join_rankings.py

      - name: Upload joined rankings artifact
        uses: actions/upload-artifact@v4
        with:
          name: joined-rankings
          path: data/normalized/rankings/joined/
          if-no-files-found: error
