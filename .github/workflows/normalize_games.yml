name: Normalize Games

on:
  workflow_dispatch:

jobs:
  normalize-games:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Normalize all discovered game data
        run: python src/normalization/games/build_games_csv.py

      - name: Upload normalized games
        uses: actions/upload-artifact@v4
        with:
          name: normalized-games
          path: data/normalized/games/
          if-no-files-found: error
