name: BetMGM Selenium Probe

on:
  workflow_dispatch:
    inputs:
      betmgm_url:
        description: "Public BetMGM page to inspect"
        required: false
        default: "https://www.betmgm.com/en/sports/football-11"
      wait_seconds:
        description: "Seconds to allow JavaScript to render"
        required: false
        default: "8"

jobs:
  probe:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r sandbox/betmgm/requirements.txt

      - name: Run BetMGM Selenium probe
        env:
          BETMGM_URL: ${{ inputs.betmgm_url }}
          WAIT_SECONDS: ${{ inputs.wait_seconds }}
        run: |
          python sandbox/betmgm/betmgm_selenium_probe.py

      - name: Upload probe artifacts
        uses: actions/upload-artifact@v4
        with:
          name: betmgm-selenium-probe
          path: output/
          if-no-files-found: error
